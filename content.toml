# Sam Cloutier's portfolio page. Every word, number and link on the page lives in this file.
#
# How to change the page:
#   1. Edit this file.
#   2. Run:  python build.py          (writes index.html; stops with a message if a rule is broken)
#   3. Run:  python check.py          (opens the page in a browser at laptop and phone size; optional)
#   4. Publish: see README.md.
#
# status = "ready"  the item is on the page.
# status = "hold"   the item stays in this file but is left off the page. "python build.py --preview"
#                   writes preview.html with held items shown and marked HOLD, for review only.
#
# This file is public on GitHub. Never put a client name, a deal name or an internal note in it.
# Every number must match Sam's private "Numbers of Record" file. Rules for agents: CLAUDE.md.

